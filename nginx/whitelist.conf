# HTTPS on PUBLIC VPS only, IPv4 socket only. Replace placeholder addresses/certs.
server {
    listen 0.0.0.0:443 ssl;
    server_name fw.example.com;
    ssl_certificate /etc/letsencrypt/live/fw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fw.example.com/privkey.pem;

    # DO NOT use 'listen [::]:443'; set A record only.
    # Never proxy arbitrary client-supplied X-Real-IP.
    location = /add {
        limit_except POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_pass http://10.1.1.1:8765;
    }
    location = /status {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_pass http://10.1.1.1:8765;
    }
    location / { return 404; }
}
